services:
  mongodb:
    image: mongo:8
    container_name: odt-mongodb
  
  odt-server:
    image: odt-server
    build: ./flask
    container_name: odt-server
    ports:
      - 5000:5000
    environment:
      MONGO_URI: mongodb://mongodb:27017/oligo_db
    develop:
      watch:
        - action: sync
          path: ./flask
          target: /app

  odt-web:
    image: node:22
    container_name: odt-web
    user: node
    working_dir: /home/node/app
    command: [npm, start]
    ports:
      - 3000:3000
    volumes:
      - ./:/home/node/app

  odt-tests:
    image: odt-tests
    build: ./tests
    container_name: odt-tests
    network_mode: host # this should be removed once the URL is configurable
    environment:
      PLAYWRIGHT_HTML_OUTPUT_DIR: /home/node/tests/playwright-report
    volumes:
      - ./tests:/home/node/tests
    profiles: [tests] # don't run unless specified
