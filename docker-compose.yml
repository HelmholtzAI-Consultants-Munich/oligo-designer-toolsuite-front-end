services:
  odt-db:
    image: mongo:8
    container_name: odt-db
    ports:
      - 27017:27017

  odt-server:
    image: odt-server
    build: ./flask
    container_name: odt-server
    ports:
      - 5000:5000
    environment:
      MONGO_URI: mongodb://odt-db:27017/oligo_db
      DEBUG: ${DEBUG:-False}

  odt-web:
    image: odt-web
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: odt-web
    ports:
      - 3000:3000

  odt-tests:
    image: odt-tests
    build: ./tests
    container_name: odt-tests
    network_mode: host # this should be removed once the URL is configurable
    environment:
      PLAYWRIGHT_HTML_OUTPUT_DIR: /home/node/tests/playwright-report
    profiles: [tests] # don't run unless specified

  odt-mongodb-exporter:
    image: percona/mongodb_exporter:0.47.2
    container_name: odt-mongodb-exporter
    command:
      - "--mongodb.uri=mongodb://odt-db:27017"
      - "--collect-all"
    depends_on:
      - odt-db
    restart: unless-stopped
    profiles: [monitoring]

  odt-node-exporter:
    image: prom/node-exporter:latest
    container_name: odt-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    profiles: [monitoring]

  odt-cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: odt-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    profiles: [monitoring]

  odt-prometheus:
    image: prom/prometheus:latest
    container_name: odt-prometheus
    ports:
      - 9090:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      - odt-mongodb-exporter
      - odt-node-exporter
      - odt-cadvisor
    restart: unless-stopped
    profiles: [monitoring]

  odt-grafana:
    image: grafana/grafana:11.3.0
    container_name: odt-grafana
    ports:
      - 3001:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - odt-prometheus
    restart: unless-stopped
    profiles: [monitoring]
