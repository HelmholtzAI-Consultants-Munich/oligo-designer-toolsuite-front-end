services:
  mongodb:
    image: mongo:8
    container_name: odt-mongodb
  
  odt-server:
    image: odt-server
    build: ./flask
    container_name: odt-server
    ports:
      - 5000:5000
    environment:
      MONGO_URI: mongodb://mongodb:27017/oligo_db
    develop:
      watch:
        - action: sync
          path: ./flask
          target: /app
