global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker Engine metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
    metrics_path: '/metrics'

  # MongoDB metrics
  - job_name: 'mongodb'
    static_configs:
      - targets: ['odt-mongodb-exporter:9216']
    metrics_path: '/metrics'

  # Flask server (add prometheus_flask_exporter to your Flask app)
  - job_name: 'odt-server'
    static_configs:
      - targets: ['odt-server:5000']
    metrics_path: '/metrics'

