name: Playwright E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Select which Playwright suite to run
        required: false
        default: full
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - 'backend/**'
              - 'src/**'
              - 'public/**'
              - 'schemas/**'
              - 'tests/**'
              - 'playwright/**'
              - 'playwright.config.ts'
              - 'docker/**'
              - 'compose.yml'
              - 'compose.override.yml'
              - '.env.sample'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'index.html'
              - '.github/workflows/e2e.yml'

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.e2e == 'true' }}
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Playwright suite
        run: |
          set -euxo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PLAYWRIGHT_SUITE=smoke" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PLAYWRIGHT_SUITE=${{ inputs.suite || 'full' }}" >> "$GITHUB_ENV"
          else
            echo "PLAYWRIGHT_SUITE=full" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      - name: Prepare env files
        run: |
          set -euxo pipefail
          cp .env.sample .env

      - name: Create artifact directories
        run: |
          set -euxo pipefail
          mkdir -p playwright-report test-results

      - name: Build test stack
        run: |
          set -euxo pipefail
          docker compose --profile tests build odt-server odt-worker odt-web odt-tests

      - name: Start application stack
        run: |
          set -euxo pipefail
          docker compose --profile tests up -d odt-db odt-redis odt-server odt-worker odt-web

      - name: Wait for application readiness
        run: |
          set -euxo pipefail
          for url in "http://localhost:3000/runs" "http://localhost:8000/api/runs"; do
            for attempt in {1..40}; do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                break
              fi
              sleep 5
              if [ "$attempt" -eq 40 ]; then
                echo "Application endpoint $url did not become ready"
                exit 1
              fi
            done
          done

      - name: Run Playwright suite in Docker
        id: playwright-run
        run: |
          set -euxo pipefail
          docker compose --profile tests run --rm odt-tests test --grep "@${PLAYWRIGHT_SUITE}"

      - name: Collect Docker logs
        if: always()
        run: |
          set -euxo pipefail
          docker compose --profile tests logs --no-color > e2e-stack.log

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ env.PLAYWRIGHT_SUITE }}-artifacts
          path: |
            playwright-report/
            test-results/
            e2e-stack.log
          retention-days: 30

      - name: Print stack log on failure
        if: failure()
        run: |
          set -euxo pipefail
          tail -n 200 e2e-stack.log

      - name: Shut down Docker stack
        if: always()
        run: |
          set -euxo pipefail
          docker compose --profile tests down --volumes

      - name: E2E summary
        if: always()
        run: |
          echo "## Playwright E2E Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Suite: \`${PLAYWRIGHT_SUITE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime: Docker Compose app stack + Playwright Docker image" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.playwright-run.outcome }}" = "success" ]; then
            echo "✅ Playwright E2E tests completed successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Playwright E2E tests failed" >> "$GITHUB_STEP_SUMMARY"
            echo "See the uploaded artifact for the HTML report, traces, and stack log." >> "$GITHUB_STEP_SUMMARY"
          fi
