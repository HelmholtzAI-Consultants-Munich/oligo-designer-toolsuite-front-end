name: E2E Test for Scrinshot

on:
  schedule:
    - cron: '0 2 1 * *'  # Run at 2:00 AM on the 1st of every month (UTC)
  workflow_dispatch:

jobs:
  e2e:
    name: 🧪 Playwright E2E Test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 🧾 Checkout Repo
        uses: actions/checkout@v4

      - name: 📥 Clone Oligo Designer Toolsuite
        run: |
          git clone https://github.com/HelmholtzAI-Consultants-Munich/oligo-designer-toolsuite odt_repo
          cd odt_repo

      - name: 🧬 Set Up Conda Environment, Bio Tools, and Backend
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true
          activate-environment: odt
          python-version: 3.11

      - name: 🔬 Install Bio Tools and ODT Repo
        run: |
          source $(conda info --base)/etc/profile.d/conda.sh
          conda activate odt
          conda config --add channels bioconda
          conda config --add channels conda-forge
          conda update --all
          conda install -n test-env -y "blast>=2.15.0"
          conda install -n test-env -y "bedtools>=2.30"
          conda install -n test-env -y "bowtie>=1.3.1"
          conda install -n test-env -y "bowtie2>=2.5"    
          pip install -e .
          cd ..

      - name: 🧪 Set Up ODT Environment from Repo
        run: |
          pip install -r environment.yml

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🚀 Start Full App (Frontend + Backend)
        run: |
          chmod +x start.sh
          ./start.sh
          sleep 30

      - name: 🎭 Install Playwright
        run: |
          npx playwright install --with-deps

      - name: 🧪 Run E2E Tests
        run: |
          npx playwright test e2e/scrinshot.e2e.ts

      - name: 📤 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            frontend/frontend.log
            backend/backend.log