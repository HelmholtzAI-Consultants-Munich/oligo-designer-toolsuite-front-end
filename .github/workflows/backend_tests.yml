name: Run Full Test Suite and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests with Coverage (Conda)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          environment-file: environment.yml
          python-version: "3.10"
          activate-environment: odt  # or whatever your env is named

      - name: Install testing dependencies
        run: |
          conda install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=flask --cov-report=term-missing