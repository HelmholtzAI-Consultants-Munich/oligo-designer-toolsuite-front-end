name: Run Backend Tests

on:
  schedule:
    - cron: "0 2 1 * *" # At 2:00 AM on the 1st day of every month (UTC)
  workflow_dispatch: # Allow manual runs from GitHub UI

jobs:
  test:
    name: Run Tests (pip + Coverage)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r flask/requirements.txt
          pip install pytest pytest-cov  # Ensure test deps are there

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..10}; do
            nc -z localhost 27017 && echo "Mongo is up!" && break
            echo "Waiting for Mongo..." && sleep 3
          done

      - name: Run tests with coverage
        run: |
          pytest --cov=flask --cov-report=term-missing
