name: Update RefSeq Species List

on:
  schedule:
    - cron: "0 2 1 * *" # Runs at 2 AM on the 1st of every month
  workflow_dispatch: # Allows manual trigger

jobs:
  update_refseq:
    name: Update RefSeq Species Lists
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run RefSeq update
        run: |
          set -euxo pipefail
          python src/forms/update_genome.py

      - name: Run Ensembl Species update
        run: |
          set -euxo pipefail
          python src/forms/update_ens.py

      - name: Run Ensembl Annotation Release update
        run: |
          set -euxo pipefail
          python src/forms/update_anno_release.py

      - name: Commit and push RefSeq changes
        run: |
          set -euxo pipefail
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit --allow-empty -m "Updated Refseq species list"
          git push

      - name: Update summary
        if: always()
        run: |
          echo "## RefSeq Update Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ RefSeq species list update completed" >> $GITHUB_STEP_SUMMARY
