name: Update RefSeq Species List

on:
  schedule:
    - cron: "0 2 1 * *"  # Runs at 2 AM on the 1st of every month
  workflow_dispatch:  # Allows manual trigger

jobs:
  update_refseq:
    name: Update RefSeq Species Lists
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run RefSeq update
        run: python src/forms/update_genome.py

      - name: Run Ensemble Species update
        run: python src/forms/update_ens.py

      - name: Commit and push RefSeq changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update RefSeq species lists"
          git push