name: Update YAML to JS

on:
  schedule:
    - cron: "0 2 1 * *"  # Runs at 2 AM on the 1st of every month
  workflow_dispatch:  # Allows manual trigger

jobs:
  update_yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install pyyaml ruamel.yaml requests

      - name: Convert YAML to JS
        run: python src/forms/update_yaml.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit --allow-empty -m "Updated YAML to JS conversion"
          git push

