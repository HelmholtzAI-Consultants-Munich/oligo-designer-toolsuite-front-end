name: Update YAML to JS

on:
  schedule:
    - cron: "0 2 1 * *" # Runs at 2 AM on the 1st of every month
  workflow_dispatch: # Allows manual trigger

jobs:
  update_yaml:
    name: Update YAML to JS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml ruamel.yaml requests

      - name: Convert YAML to JS
        run: |
          set -euxo pipefail
          python src/forms/update_yaml.py

      - name: Commit and push changes
        run: |
          set -euxo pipefail
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit --allow-empty -m "Updated YAML to JS conversion"
          git push

      - name: Update summary
        if: always()
        run: |
          echo "## YAML to JS Update Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ YAML to JS conversion update completed" >> $GITHUB_STEP_SUMMARY
