name: Create and publish Docker images for all production services

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-server-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: odt-server
            dockerfile_path: docker/server.Dockerfile
            build_args: ""
          - image_name: odt-worker
            dockerfile_path: docker/worker.Dockerfile
            build_args: ""
          - image_name: odt-web
            dockerfile_path: docker/web.Dockerfile
            build_args: |
              VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
              VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
              VITE_FEEDBACK_MAX_LENGTH=${{ vars.VITE_FEEDBACK_MAX_LENGTH }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Get metadata for server Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=semver,pattern={{version}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push server Docker image
        uses: docker/build-push-action@v7
        with:
          file: ${{ matrix.dockerfile_path }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
