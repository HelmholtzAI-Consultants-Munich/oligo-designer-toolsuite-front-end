services:
  odt-db:
    ports:
      - 27017:27017
    restart: on-failure

  odt-redis:
    ports:
      - 6379:6379
    restart: on-failure

  odt-server:
    command: ["flask", "run", "--host=0.0.0.0", "--port=8000"]
    ports:
      - 5000:8000
    restart: on-failure
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app/backend
          initial_sync: true

  odt-beat:
    restart: on-failure
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend
          initial_sync: true

  odt-worker:
    restart: on-failure
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend
          initial_sync: true

  odt-web:
    image: odt-web:dev
    build:
      target: dev
    ports:
      - 3000:3000
    env_file:
      - .env
    restart: on-failure
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true

  odt-tests:
    image: odt-tests:dev
    build:
      dockerfile: docker/tests.Dockerfile
    network_mode: host # this should be removed once the URL is configurable
    environment:
      PLAYWRIGHT_HTML_OUTPUT_DIR: /app/playwright-report
    depends_on:
      - odt-web
      - odt-server
      - odt-worker
      - odt-redis
      - odt-db
    volumes:
      - ./playwright/report:/app/playwright-report
      - ./playwright/results:/app/test-results
    restart: no
    profiles: [tests] # don't run unless specified

  odt-mongodb-exporter:
    image: percona/mongodb_exporter:0.47.2
    command:
      - "--mongodb.uri=mongodb://odt-db:27017"
      - "--collect-all"
    depends_on:
      - odt-db
    restart: unless-stopped
    profiles: [monitoring]

  odt-node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro
    restart: unless-stopped
    profiles: [monitoring]

  odt-cadvisor:
    image: ghcr.io/google/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    profiles: [monitoring]

  odt-prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090
    restart: unless-stopped
    profiles: [monitoring]

  odt-grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - odt-prometheus
    ports:
      - 3001:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    restart: unless-stopped
    profiles: [monitoring]
