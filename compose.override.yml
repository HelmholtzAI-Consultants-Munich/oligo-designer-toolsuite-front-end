# This file contains development-specific overrides for the Docker compose configuration.
#
# The overrides defined here are applied by default when running `docker compose ...`.
# For the base configuration and more information, see `compose.yml`.

services:
  odt-db:
    ports:
      - 27017:27017
    restart: on-failure

  odt-redis:
    ports:
      - 6379:6379
    restart: on-failure

  odt-server:
    # The production container uses `gunicorn`
    # Using `flask` instead provides debug messages and hot code reloading
    command: ["flask", "run", "--host=0.0.0.0", "--port=8000"]
    ports:
      - 8000:8000
    restart: on-failure
    develop:
      # Hot code reloading (used by `docker compose watch`):
      # Sync source code into running container, recognized by Flask's hot code reloading
      watch:
        - action: sync
          path: ./backend
          target: /app/backend
          initial_sync: true

  odt-beat:
    restart: on-failure
    develop:
      # Hot code reloading (used by `docker compose watch`):
      # Restart container with synced source code
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend
          initial_sync: true

  odt-worker:
    restart: on-failure
    develop:
      # Hot code reloading (used by `docker compose watch`):
      # Restart container with synced source code
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend
          initial_sync: true

  odt-web:
    image: odt-web:dev
    build:
      # The production container uses nginx to host compiled (i.e. bundled and minified) static files
      # The dev target runs Vite's dev server instead, providing unmodified source files and hot code reloading
      target: dev
    ports:
      - 3000:3000
    # The container's build-time arguments are ignored for the dev target
    # They need to be provided as environment variables instead, allowing changes without rebuilding
    env_file:
      - .env
    restart: on-failure
    develop:
      # Hot code reloading (used by `docker compose watch`):
      # Sync source code into running container, recognized by Vite's hot code reloading
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true

  # Playwright tests
  odt-tests:
    image: odt-tests:dev
    build:
      dockerfile: docker/tests.Dockerfile
    network_mode: host # this should be removed once the URL is configurable
    environment:
      PLAYWRIGHT_HTML_OUTPUT_DIR: /app/playwright-report
    depends_on:
      - odt-web
      - odt-server
      - odt-worker
      - odt-redis
      - odt-db
    volumes:
      - ./playwright/report:/app/playwright-report
      - ./playwright/results:/app/test-results
    restart: no
    profiles: [tests] # don't run unless specified

  # --- Monitoring ---
  # The monitoring containers are currently limited to the dev environment since
  # they are not configured for our production deployment setup (i.e. multiple nodes).

  # Monitoring: MongoDB metrics exporter
  odt-mongodb-exporter:
    image: percona/mongodb_exporter:0.47.2
    command:
      - "--mongodb.uri=mongodb://odt-db:27017"
      - "--collect-all"
    depends_on:
      - odt-db
    restart: unless-stopped
    profiles: [monitoring]

  # Monitoring: System metrics exporter
  odt-node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro
    restart: unless-stopped
    profiles: [monitoring]

  # Monitoring: System metrics exporter II.
  odt-cadvisor:
    image: ghcr.io/google/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    profiles: [monitoring]

  # Monitoring: Metrics aggregator
  odt-prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090
    restart: unless-stopped
    profiles: [monitoring]

  # Monitoring: Metrics visualizer
  odt-grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - odt-prometheus
    ports:
      - 3001:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    restart: unless-stopped
    profiles: [monitoring]
