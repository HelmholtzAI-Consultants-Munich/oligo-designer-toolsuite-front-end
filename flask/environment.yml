name: odt
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core runtime
  - python=3.11
  - pip=24.3.1
  - git # required by setuptools-scm for local odt install

  # Genomic CLI toolchain
  - bedtools=2.31.1
  - blast=2.16.0
  - bowtie=1.3.1
  - bowtie2=2.5.4

  # Python packages installed via pip
  - pip:
      # Backend & API stack
      - Authlib==1.3.1
      - python-dotenv==1.0.1
      - Flask==3.1.1
      - flask-cors==6.0.1
      - Flask-Login==0.6.3
      - Flask-PyMongo==3.0.1
      - requests==2.32.4
      - PyYAML==6.0.2

      # Testing & QA
      - coverage==7.10.4
      - pytest==8.4.1
      - pytest-cov==6.2.1
      - pytest-mock==3.14.1