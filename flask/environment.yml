name: odt
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core runtime
  - python=3.12
  - pip>=25.1 # min version supporting dependency groups
  # TODO: Flask technically does not need everything below this line, only the Worker needs this
  - git       # required by setuptools-scm for local odt install
  
  # Oligo Designer Toolsuite dependencies
  - bcftools>=1.22 # required in next ODT version
  - bedtools>=2.30
  - blast>=2.15.0
  - bowtie>=1.3.1
  - bowtie2>=2.5
