name: odt
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core runtime
  - python=3.11
  - pip=24.3.1
  - setuptools
  - wheel

  # Genomic CLI toolchain
  - bedtools=2.31.1
  - blast=2.16.0
  - bowtie=1.3.1
  - bowtie2=2.5.4
  - entrez-direct=22.4
  - ncbi-vdb=3.1.1
  - rpsbproc=0.5.0
  - curl=8.10.1
  - wget=1.21.4

  # Python packages installed via pip
  - pip:
      # Backend & API stack
      - Authlib==1.3.1
      - python-dotenv==1.0.1
      - Flask==3.1.1
      - flask-cors==6.0.1
      - Flask-Login==0.6.3
      - Flask-PyMongo==3.0.1
      - pymongo==4.13.2
      - requests==2.32.4
      - PyYAML==6.0.2

      # Genomic analysis libraries (Scrinshot & related pipelines)
      - bio==1.8.0
      - biopython==1.85
      - gprofiler-official==1.0.0
      - matplotlib==3.10.3
      - networkx==3.4.2
      - numpy==1.26.4
      - pandas==2.3.1
      - scipy==1.15.3
      - seaborn==0.13.2
      - seqfold==0.7.18
      - torch==2.2.2

      # Testing & QA
      - coverage==7.10.4
      - pytest==8.4.1
      - pytest-cov==6.2.1
      - pytest-mock==3.14.1